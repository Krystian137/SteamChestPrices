{% extends "base.html" %}

{% block content %}
<div class="album py-5">
    <div class="container">
        <div class="mb-4 text-center">
            <a href="/?sort=name&order={{ 'desc' if current_sort == 'name' and current_order == 'asc' else 'asc' }}"
               class="btn btn-sm btn-outline-light mx-1">Sortuj po nazwie</a>
            <a href="/?sort=price&order={{ 'desc' if current_sort == 'price' and current_order == 'asc' else 'asc' }}"
               class="btn btn-sm btn-outline-light mx-1">Sortuj po cenie</a>
            <a href="/?sort=change&order={{ 'desc' if current_sort == 'change' and current_order == 'asc' else 'asc' }}"
               class="btn btn-sm btn-outline-light mx-1">Sortuj po zmianie %</a>
        </div>
        <div class="row">
            {% if cases %}
                {% for chest_name, chest_info in cases %}
                    <div class="col-md-3">
                        <a href="{{ url_for('main.chest_info', case_code=chest_info['code']) }}" class="text-decoration-none">
                            <div class="card mb-3 box-shadow field_drab text-light">
                                <img src="{{ chest_info.image }}" class="card-img-top" alt="{{ chest_name }}">
                                <div class="card-body field_drab">
                                    <h5 class="card-title">{{ chest_name }}</h5>
                                    <p class="card-text">{{ chest_info['latest_price'] }} zł</p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="btn-group">
                                            <button type="button" class="btn btn-sm btn-outline-secondary text-light">Sprawdź</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                {% endfor %}
            {% else %}
                <p>Brak wyników dla "{{ query }}"</p>
            {% endif %}
        </div>
    </div>
</div>

{% endblock %}
