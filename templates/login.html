{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">CS2 Case Tracker</div>
        <h1 class="auth-title">Logowanie</h1>
        <p class="auth-subtitle">Zaloguj się, aby zarządzać swoimi skrzyniami</p>

        <form method="POST" novalidate>
            <div class="auth-field">
                <label class="auth-label" for="name">Login</label>
                <input
                    type="text"
                    class="auth-input"
                    id="name"
                    name="name"
                    placeholder="Twój login"
                    value="{{ request.form.get('name', '') }}"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="auth-field">
                <label class="auth-label" for="password">Hasło</label>
                <input
                    type="password"
                    class="auth-input"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">Zaloguj się →</button>
        </form>

        <div class="auth-footer">
            Nie masz konta?&nbsp;
            <a href="{{ url_for('main.register') }}">Zarejestruj się</a>
        </div>
    </div>
</div>
{% endblock %}
