{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">CS2 Case Tracker</div>
        <h1 class="auth-title">Rejestracja</h1>
        <p class="auth-subtitle">Załóż konto i zacznij śledzić swoje skrzynie</p>

        <form method="POST" novalidate>
            <div class="auth-field">
                <label class="auth-label" for="name">Login</label>
                <input
                    type="text"
                    class="auth-input"
                    id="name"
                    name="name"
                    placeholder="Wybierz login"
                    value="{{ request.form.get('name', '') }}"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="auth-field">
                <label class="auth-label" for="password">Hasło</label>
                <input
                    type="password"
                    class="auth-input"
                    id="password"
                    name="password"
                    placeholder="Minimum 8 znaków"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">Zarejestruj się →</button>
        </form>

        <div class="auth-footer">
            Masz już konto?&nbsp;
            <a href="{{ url_for('main.login') }}">Zaloguj się</a>
        </div>
    </div>
</div>
{% endblock %}
